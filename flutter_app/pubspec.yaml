name: try1second
description: >-
  Try1Second — the independent metasearch app. Live cross-site price
  comparison, real price history and honest availability for 11 verticals
  in India. Every price comes from the real Try1Second engine; the app
  never invents data.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
