name: try1second
description: >-
  Try1Second — the independent metasearch app. Live cross-site price
  comparison, real price history and honest availability for 10 verticals
  in India. Every price comes from the real Try1Second engine; the app
  never invents data.
publish_to: "none"
version: 1.8.39+46

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  # SPEED (21 Oct): disk-cached product photos — Image.network re-downloaded
  # every image on every scroll; the web browser caches aggressively.
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  webview_flutter: ^4.14.1
  share_plus: ^13.3.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-icon.png
    - assets/images/logo-wordmark.png
    - assets/images/logo-full.png
    - assets/images/logo-tagline.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/adaptive-bg.png"
  adaptive_icon_foreground: "assets/images/adaptive-fg.png"
