name: Retry hotel query alias deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch the actual hotel request handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = "const query = String(q.query || q.q || q.city || q.destination || q.cityName || '').trim();"
          changed = False
          matches = []

          for path in Path('server').rglob('*.ts'):
              text = path.read_text()
              if 'No query provided' not in text:
                  continue
              matches.append(str(path))
              updated, count = re.subn(
                  r"const\\s+query\\s*=\\s*String\\([^;]*?\\)\\.trim\\(\\);",
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count:
                  path.write_text(updated)
                  changed = True
                  print(f'Patched {path}')

          if not matches:
              raise SystemExit('No hotel request handler containing the no-query response was found')
          if not changed:
              raise SystemExit('The hotel request handler was found, but its query declaration pattern was not found')
          print('Inspected: ' + ', '.join(matches))
          PY

      - name: Type-check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'Hostinger Agent'
          git config user.email 'hostinger-agent@users.noreply.github.com'
          git add server
          git commit -m 'fix(hotels): accept city and destination aliases in live search'
          git push origin HEAD:main
