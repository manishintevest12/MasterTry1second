name: Fix hotel query aliases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize hotel destination query
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('server/workers/verticals/hotels.ts')
          text = path.read_text()
          replacement = "const query = String(q.query || q.q || q.city || q.destination || q.cityName || '').trim();"
          patterns = [
              r"const query = String\(q\.query \|\| q\.q \|\| ''\)\.trim\(\);",
              r'const query = String\(q\.query \|\| q\.q \|\| ""\)\.trim\(\);',
          ]
          changed = False
          for pattern in patterns:
              text, count = re.subn(pattern, replacement, text)
              changed = changed or count > 0
          if not changed:
              if replacement not in text:
                  raise SystemExit('Hotel query selector was not found')
              print('Hotel query aliases already present')
          else:
              path.write_text(text)
              print('Hotel query aliases patched')
          PY

      - name: Type-check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'Hostinger Agent'
          git config user.email 'hostinger-agent@users.noreply.github.com'
          git add server/workers/verticals/hotels.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix(hotels): accept city and destination query aliases'
            git push origin HEAD:main
          fi
