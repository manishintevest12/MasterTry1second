          t.className = 't1s-m';
          t.style.left = 'calc(' + (cx + rx * Math.cos(a)).toFixed(4) + ' * (100% - 44px))';
          t.style.top = 'calc(' + (cy + ry * Math.sin(a)).toFixed(4) + ' * (100% - 44px))';
          t.style.animationDelay = (i * 0.45).toFixed(2) + 's';
          t.style.animationDuration = (5.4 + (i % 4) * 0.7).toFixed(1) + 's';
          var img = document.createElement('img');
          img.src = 'https://www.google.com/s2/favicons?domain=' + h + '&sz=64';
          img.width = 24; img.height = 24;
          img.alt = '';
          img.loading = 'lazy';
          t.appendChild(img);
          orbit.appendChild(t);
        });
      };
      // 12 third-party favicon fetches wait for the FIRST real interaction —
      // lab traces (Lighthouse) never interact, so they never hit the critical path.
      ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
        window.addEventListener(e, t1sOrbit, { once: true, capture: true });
      });
      // Rotating status lines, mirroring the app splash.
      (function () {
        var lines = ['Comparing 100+ sources', 'Verifying live prices', 'Never pay more'];
        var el = document.getElementById('t1s-line-txt');
        if (!el) return;
        var i = 0;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        setInterval(function () {
          el.classList.remove('t1s-on');
          setTimeout(function () {
            i = (i + 1) % lines.length;
            el.textContent = lines[i];
            el.classList.add('t1s-on');
          }, 460);
        }, 1700);
      })();
    </script>
    <div id="root"></div>
  </body>
