      #t1s-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff7f2;transition:opacity .35s ease,visibility .35s ease}

      @media (prefers-reduced-motion:reduce){#t1s-loader .t1s-logo,#t1s-loader .t1s-bar i{animation:none}}
