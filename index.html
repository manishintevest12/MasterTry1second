    <style>
      #t1s-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#fff;transition:opacity .35s ease,visibility .35s ease}
      #t1s-loader.t1s-hide{opacity:0;visibility:hidden;pointer-events:none}
      #t1s-loader .t1s-lockup{display:flex;align-items:center;height:76px;max-width:88vw}
      #t1s-loader .t1s-lockup .t1s-ic{position:relative;display:inline-flex;height:76px}
      #t1s-loader .t1s-lockup img{height:76px;width:auto;max-width:none;display:block}
      #t1s-loader .t1s-lockup .t1s-ic img{transform-origin:50% 70%;animation:t1s-ltap 1.2s ease-in-out infinite}
      #t1s-loader .t1s-lockup .t1s-ring{position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(231,0,11,.55);opacity:0;animation:t1s-lripple 1.2s ease-out infinite}
      #t1s-loader .t1s-lockup .t1s-wd{margin-left:-2px;animation:t1s-lword .6s cubic-bezier(.2,.8,.2,1) both}
      #t1s-loader .t1s-bar{width:160px;height:4px;border-radius:99px;background:#f1e3e6;overflow:hidden}
      #t1s-loader .t1s-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#c10007,#e7000b);animation:t1s-slide 1s ease-in-out infinite}
      @keyframes t1s-ltap{0%,45%,100%{transform:translateY(0) scale(1) rotate(0)}58%{transform:translateY(3px) scale(.92) rotate(-5deg)}75%{transform:translateY(-2px) scale(1.07) rotate(3deg)}}
      @keyframes t1s-lripple{0%,50%{transform:scale(.6);opacity:0}60%{opacity:.9}100%{transform:scale(1.8);opacity:0}}
      @keyframes t1s-lword{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
      @keyframes t1s-slide{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
      @media (prefers-reduced-motion:reduce){#t1s-loader .t1s-lockup img,#t1s-loader .t1s-ring,#t1s-loader .t1s-wd,#t1s-loader .t1s-bar i{animation:none}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-red-600 selection:text-white min-h-screen">
    <div id="t1s-loader" role="status" aria-live="polite" aria-label="Loading Try1Second">
      <div class="t1s-lockup">
        <span class="t1s-ic"><img src="/logo-icon.png" alt="" /><span class="t1s-ring"></span></span>
        <img class="t1s-wd" src="/logo-wordmark.png" alt="Try1Second" />
      </div>
      <div class="t1s-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
