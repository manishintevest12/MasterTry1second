<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Try1Second</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="t1s-top">
    <div class="t1s-lockup" role="img" aria-label="Try1Second - 1 Second Is All It Takes">
      <span class="t1s-ic"><img src="../images/logo-icon.png" alt="" /><span class="t1s-ring"></span></span>
      <img class="t1s-wd" src="../images/logo-wordmark.png" alt="" />
    </div>
    <span id="drops-badge" class="t1s-drops hidden"></span>
  </header>

  <nav class="t1s-tabs">
    <button class="t1s-tab active" data-tab="search">Search</button>
    <button class="t1s-tab" data-tab="tracked">Tracked <span id="tracked-count" class="t1s-count">0</span></button>
    <button class="t1s-tab" data-tab="settings">Settings</button>
  </nav>

  <!-- SEARCH -->
  <section id="tab-search" class="t1s-panel">
    <div class="t1s-searchrow">
      <input id="q" type="text" placeholder="Search any product across sites…" />
      <button id="go" class="t1s-go">→</button>
    </div>
    <div id="results" class="t1s-results"></div>
  </section>

  <!-- TRACKED -->
  <section id="tab-tracked" class="t1s-panel hidden">
    <div class="t1s-row-tools">
      <button id="poll-now" class="t1s-btn">Check prices now</button>
      <span id="last-poll" class="t1s-muted"></span>
    </div>
    <div id="tracked-list" class="t1s-results"></div>
  </section>

  <!-- SETTINGS -->
  <section id="tab-settings" class="t1s-panel hidden">
    <label class="t1s-label">City (for live pricing)
      <input id="set-city" type="text" placeholder="e.g. Indore" />
    </label>
    <label class="t1s-label">Pincode
      <input id="set-pincode" type="text" placeholder="e.g. 452001" />
    </label>
    <label class="t1s-label">Try1Second backend URL
      <input id="set-api" type="text" placeholder="https://www.try1second.com" />
    </label>
    <p class="t1s-muted t1s-note">Price checks run every 30 minutes. Every price shown comes from the real Try1Second engine — when a source is blocked or has no data, Try1Second says "unavailable" instead of guessing.</p>
    <button id="save-settings" class="t1s-btn t1s-save">Save settings</button>
    <span id="save-ok" class="t1s-saveok hidden">Saved ✓</span>
  </section>

  <footer class="t1s-foot">
    <a href="https://www.try1second.com" target="_blank" rel="noopener">Open Try1Second →</a>
  </footer>

  <script src="../lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
